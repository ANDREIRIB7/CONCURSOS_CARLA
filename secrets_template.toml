# ══════════════════════════════════════════════════════════════
# COLE ESTE CONTEÚDO em:
#   Streamlit Cloud → seu app → Settings → Secrets
# ══════════════════════════════════════════════════════════════
#
# ── OPÇÃO A: Supabase (recomendado) ──────────────────────────
# 1. Crie conta grátis em https://supabase.com
# 2. Crie um projeto → abra o SQL Editor e execute:
#
#   CREATE TABLE IF NOT EXISTS materias (
#     id SERIAL PRIMARY KEY,
#     dados JSONB NOT NULL DEFAULT '[]'::jsonb,
#     updated_at TIMESTAMPTZ DEFAULT NOW()
#   );
#   INSERT INTO materias (dados) VALUES ('[]'::jsonb);
#
#   CREATE TABLE IF NOT EXISTS sessoes (
#     id SERIAL PRIMARY KEY,
#     dados JSONB NOT NULL,
#     created_at TIMESTAMPTZ DEFAULT NOW()
#   );
#
# 3. Settings → API → copie a Project URL e a anon public key
# 4. Cole aqui:

[supabase]
url = "https://SEU_PROJETO.supabase.co"
key = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

# ── OPÇÃO B: GitHub Gist (alternativo) ───────────────────────
# 1. Crie conta no GitHub
# 2. github.com/settings/tokens → New token (classic) → marque APENAS "gist"
# 3. Crie um Gist em https://gist.github.com com dois arquivos:
#    - materias.json  (conteúdo: [])
#    - sessoes.json   (conteúdo: [])
# 4. Copie o ID do Gist (hash de 32 chars na URL)
# 5. Cole aqui (e comente ou remova a seção [supabase] acima):

# [gist]
# token   = "ghp_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
# gist_id = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
